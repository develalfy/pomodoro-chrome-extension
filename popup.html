<!DOCTYPE html>
<html>
<head>
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Pomodoro Timer</h1>
    <div class="mode-label" id="modeLabel">Work Time</div>
    <div class="timer" id="timer">25:00</div>
    <div class="controls">
      <button id="startBtn" class="button primary">Start</button>
      <button id="pauseBtn" class="button secondary" disabled>Pause</button>
      <button id="resetBtn" class="button secondary">Reset</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
