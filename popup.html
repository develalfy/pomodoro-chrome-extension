<!DOCTYPE html>
<html>
<head>
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="settings.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <button id="settingsBtn" class="settings-button">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path>
      </svg>
    </button>

    <h1 class="title">Pomodoro Timer</h1>
    <div class="mode-label" id="modeLabel">Work Time</div>
    
    <div class="progress-ring">
      <svg width="160" height="160">
        <circle id="progressRing" cx="80" cy="80" r="70" stroke="#e2e8f0" stroke-width="8" fill="none"/>
        <circle id="progressIndicator" cx="80" cy="80" r="70" stroke="#4f46e5" stroke-width="8" fill="none"/>
      </svg>
      <div class="timer" id="timer">25:00</div>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="completedPomodoros">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="totalFocusTime">0</div>
        <div class="stat-label">Focus Time</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="dailyGoal">0%</div>
        <div class="stat-label">Daily Goal</div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="button primary">Start</button>
      <button id="pauseBtn" class="button secondary" disabled>Pause</button>
      <button id="resetBtn" class="button secondary">Reset</button>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Settings</h2>
          <button class="close-button" id="closeSettings">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
          </button>
        </div>

        <div class="settings-group">
          <label class="settings-label">Work Duration (minutes)</label>
          <input type="number" id="workDuration" class="settings-input" min="1" max="60" value="25">
          
          <label class="settings-label">Short Break Duration (minutes)</label>
          <input type="number" id="shortBreakDuration" class="settings-input" min="1" max="30" value="5">
          
          <label class="settings-label">Long Break Duration (minutes)</label>
          <input type="number" id="longBreakDuration" class="settings-input" min="1" max="60" value="15">
          
          <label class="settings-label">Long Break Interval (sessions)</label>
          <input type="number" id="longBreakInterval" class="settings-input" min="1" max="10" value="4">
        </div>

        <button id="saveSettings" class="save-button">Save Settings</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
